name: Build SwApperPro
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SwApperPro-App.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: cd SwApperPro-App && gradle assembleDebug --no-daemon
      - run: cp SwApperPro-App/app/build/outputs/apk/debug/*.apk SwApperPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwApperPro-v2
          path: SwApperPro.apk
